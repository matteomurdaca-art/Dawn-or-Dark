<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0F0B07"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dawn or Dark"></head><body>
<meta charset="utf-8">
<title>Dawn or Dark</title>
<meta name="description" content="Solo cooperative push-your-luck card game from the Halloween Scream collection.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital@0;1&family=Alegreya+Sans:wght@700&family=Grenze+Gotisch:wght@700&display=swap">
<style>
:root{--bg:#0F0B07;--panel:#1B140D;--line:#43362A;--bone:#EFE3C8;--dim:#A39A8B;--gold:#E8A33C;--teal:#7FD0C0;--rose:#E2638F;--blood:#8F2B1A;--ok:#8FB47A;--ko:#E07A5F;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--bone)}
body{font-family:Alegreya,Georgia,serif;font-size:17px;line-height:1.4;padding:16px;max-width:760px;margin:0 auto;position:relative;min-height:100vh}
body:after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 calc(var(--dv,0)*160px) calc(var(--dv,0)*50px) rgba(143,43,26,calc(var(--dv,0)*.55));transition:box-shadow .6s;z-index:5}
body.shake #row{animation:shake .5s}
body.flashbad:before{content:"";position:fixed;inset:0;background:rgba(200,40,20,.35);pointer-events:none;animation:fl .7s forwards;z-index:6}
body.flashgood:before{content:"";position:fixed;inset:0;background:rgba(240,200,107,.22);pointer-events:none;animation:fl .7s forwards;z-index:6}
@keyframes fl{from{opacity:1}to{opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
h1,h2{font-family:"Grenze Gotisch",Georgia,serif;font-weight:700;margin:0}
h1{font-size:2.3rem;line-height:1}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.tb{display:flex;gap:8px;flex-wrap:wrap}
.sub{color:var(--dim);font-style:italic;margin:.3rem 0 1rem}
.lab{font-family:"Alegreya Sans",system-ui,sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
button{font:inherit;color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.6rem 1rem;cursor:pointer;min-height:44px}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
button.main{background:var(--blood);border-color:var(--blood);font-weight:700}
button.gold{background:#3a2a10;border-color:var(--gold);color:var(--gold);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat.marked{border-color:var(--ko);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 12px rgba(224,122,95,.55)}}
.stat b{display:block;font-family:"Grenze Gotisch",serif;font-size:1.25rem;margin:.1rem 0}
.pips{display:flex;gap:6px;min-height:22px;align-items:center;flex-wrap:wrap}
.pip{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--c);background:var(--c)}
.pip.off{background:transparent;opacity:.35}
.sm{font-size:.82rem;margin-top:.3rem;color:var(--dim)} .sm.on{color:var(--c)} .sm.hot{color:var(--ko)}
.bar{height:10px;border-radius:5px;background:#2a2016;margin-top:.4rem;overflow:hidden} .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.danger{margin-bottom:14px} .danger .bar{height:14px} .danger .bar i{transition:width .5s,background .5s}
.dl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;min-height:104px;margin-top:8px}
.card{width:68px;height:98px;border:2px solid var(--c);border-radius:8px;background:radial-gradient(circle at 50% 55%,var(--g),#17100B 85%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;animation:in .3s ease-out}
.card svg{width:40px;height:40px;fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.card .n{position:absolute;font-family:"Grenze Gotisch",serif;font-size:2.4rem;color:var(--bone);text-shadow:0 0 6px #000}
.card .t{position:absolute;bottom:3px;font-family:"Alegreya Sans",sans-serif;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.card.omen svg{opacity:.95}
.card.back{--c:#E8A33C;background:#150E09;animation:flip .5s ease-in-out infinite alternate}
.card.back span{font-family:"Grenze Gotisch",serif;font-size:2rem;color:var(--gold)}
@keyframes in{from{transform:translateY(-10px) scale(.88);opacity:0}to{transform:none;opacity:1}}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(35deg)}}
.msg{white-space:pre-line;min-height:5.2em;margin:.6rem 0;font-style:italic}
.msg.bad{color:var(--ko)} .msg.good{color:var(--ok)} .msg.warn{color:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{flex:1 1 180px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.actions button small{font-weight:400;font-size:.8rem;opacity:.9}

.diff{display:flex;gap:10px;flex-wrap:wrap;margin:.6rem 0 1rem} .diff button{flex:1 1 130px}
details{margin:.6rem 0} summary{cursor:pointer;color:var(--gold)}
details p,details li{color:#D9CBAE}
.end{text-align:center} .end h2{font-size:2rem}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:.9rem;margin-top:10px}
.ov{position:fixed;inset:0;background:rgba(10,7,4,.92);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto}
.ov .panel{max-width:460px;width:100%;margin:0;text-align:center}
.tut .demo{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0;align-items:center} .tut .demo .arrow{font-size:1.6rem;color:var(--gold)}
.tut .demo .res{font-family:"Grenze Gotisch",serif;font-size:1.3rem;color:var(--ko)}
.tut p{margin:.4rem 0;color:#D9CBAE} .tut h2{margin-bottom:.3rem}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}
.hero{display:block;width:100%;height:auto;border-radius:10px;margin-bottom:14px;border:1px solid var(--line)}

/* ---- compact phone-first game layout ---- */
body{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.9rem}
.top{gap:8px;margin-bottom:8px}.sub{margin:.2rem 0 .6rem}
.tb{gap:6px;margin-left:auto}.tb button{min-height:40px;padding:.3rem .65rem;font-size:.95rem}
.stats{display:block;margin-bottom:8px}
.hud1{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:6px;margin-bottom:6px}
.hud1 .stat{padding:7px 9px;border-radius:10px}.hud1 .stat b{font-size:1.05rem;margin:.05rem 0}
.hud1 .pip{width:14px;height:14px}.hud1 .pips{min-height:16px;gap:5px;margin-top:2px}.hud1 .bar{height:8px;margin-top:.25rem}
.hud2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 4px;text-align:center;min-width:0}
.chip .lab{font-size:.6rem;letter-spacing:.12em}.chip b{display:block;font-family:"Grenze Gotisch",serif;font-size:1.35rem;line-height:1.1}
.chip .sm{font-size:.68rem;margin-top:0}
.chip.marked{border-color:var(--ko);animation:pulse 1.2s infinite}
.panel{padding:10px 12px;margin-bottom:8px}.danger{margin-bottom:8px}.danger .bar{height:10px;margin-top:.3rem}.danger .sm{font-size:.78rem;margin-top:.25rem;line-height:1.25}
.row{min-height:84px;gap:6px;margin-top:6px}
.card{width:54px;height:78px;border-width:2px}.card svg{width:30px;height:30px}.card .n{font-size:2rem}.card .t{font-size:.4rem;bottom:2px;letter-spacing:.08em;text-align:center;line-height:1.1}
.msg{min-height:4.6em;font-size:.98rem;line-height:1.3;margin:.3rem 0}
#acts{position:fixed;left:0;right:0;bottom:0;z-index:8;max-width:760px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(15,11,7,0),var(--bg) 22%);flex-wrap:nowrap}
#acts button{flex:1 1 0;min-height:56px;padding:.4rem .5rem;font-size:1.02rem}
#acts button small{font-size:.74rem}
.foot{font-size:.85rem;margin-top:4px}
@media (max-width:420px){h1{font-size:1.65rem}.msg{min-height:4.1em;font-size:.95rem}body{padding-top:12px}}
.rank{margin-bottom:12px}.rk{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.rank .bar{height:8px;margin-top:.3rem}.rank .sm{margin-top:.25rem}
.daily{width:100%;margin-bottom:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}.daily small{font-weight:400;font-size:.8rem;opacity:.9}
.relics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}.relic{text-align:left;padding:.5rem .6rem;line-height:1.2;font-size:.95rem}.relic small{display:block;font-size:.72rem;color:var(--dim);margin-top:2px}.relic.sel{border-color:var(--gold);background:#3a2a10}.relic:disabled{opacity:.5}
#prog{margin-top:12px}#prog summary{padding:.3rem 0}.ach{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ach .a{border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--dim)}.ach .a.on{border-color:var(--gold);color:var(--bone)}.ach small{display:block;font-size:.72rem;font-weight:400;opacity:.85}
.rh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px}.rh .lab{white-space:nowrap}.rh .relicTag{order:3;flex-basis:100%;white-space:normal;letter-spacing:.1em}.rh .relicTag:empty{display:none}.relicTag{color:var(--gold)}.endx{white-space:pre-line;color:var(--gold);margin:.4rem 0 .8rem}
#acts #gift{flex:0 0 auto;min-width:86px;font-size:.9rem;line-height:1.15}
button.chip{color:var(--bone);font:inherit;min-height:0;padding:5px 4px}.chip.pile{cursor:pointer;border-width:2px}.chip.pile:hover:not(:disabled){background:#2a1f13}.chip.pile:disabled{opacity:.35}.chip.peek{outline:2px dashed var(--gold)}
.opts button{flex:1 1 140px;font-size:.95rem}.opts button.sel{border-color:var(--gold);background:#3a2a10;color:var(--gold)}#optsH{margin:-4px 0 12px}
body{padding-bottom:calc(176px + env(safe-area-inset-bottom,0px))}
.top{position:relative;z-index:25}
#acts{flex-wrap:wrap!important;row-gap:8px}
#acts .trow{flex:1 1 100%;display:flex;gap:8px}
#acts .trow button{flex:1 1 0;min-width:0;min-height:44px;font-size:.9rem;line-height:1.15;padding:.3rem .4rem}
#acts .trow button small{font-size:.68rem}
#acts #gift{flex:1 1 0;min-width:0}
.charms{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.charms:empty{display:none}
.charm{border:1px solid var(--gold);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--gold);background:#241a0c;min-height:0;cursor:pointer}
#cmbT{font-size:.78rem;margin-top:6px}
#chInfo{font-size:.85rem;color:var(--gold);margin:-2px 0 8px;white-space:pre-line}#chInfo:empty{display:none}
.offer{align-items:flex-start;padding-top:84px}
.offer .panel{text-align:left}.offer button{display:block;width:100%;text-align:left;margin-bottom:8px;line-height:1.25}.offer button small{display:block;color:var(--dim);font-weight:400;font-size:.82rem}

.logD{margin:6px 0}.logD summary{font-size:.85rem}.lr{font-size:.85rem;color:var(--dim);margin:2px 0}
[hidden]{display:none!important}
</style>
